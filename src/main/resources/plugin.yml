name: MeteorAntiESP
version: 2.0.0
main: com.meteorsmp.antiesp.AntiESPPlugin
api-version: '1.21'
description: Hides players behind walls (anti-ESP / anti-freecam for entities)
commands:
  antifreecam:
    description: AntiESP admin command
    usage: /<command> <reload|toggle|status|bypass [player]>
    aliases: [antiesp]
permissions:
  antifreecam.admin:
    default: op
  antifreecam.bypass:
    default: false
  antiesp.bypass:
    default: false
