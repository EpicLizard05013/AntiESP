name: MeteorGuard
version: '1.2'
main: com.meteorsmp.antiesp.AntiESPPlugin
api-version: '1.21'
softdepend: [GrimAC, floodgate, Luckperms]
description: Advanced anti-ESP, container hiding, join protection, item checks, and staff alerts.

commands:
  meteorguard:
    description: Main administrative command for MeteorGuard
    permission: meteorguard.admin
    usage: /<command> [reload]
    aliases: [antiesp, shield, antifreecam]

permissions:
  meteorguard.admin:
    description: Allows full administrative access to MeteorGuard commands
    default: op
  antifreecam.admin:
    default: op
  antifreecam.bypass:
    default: false
  antiesp.bypass:
    default: false
  meteorshield.alerts:
    default: op
  meteorshield.bypass:
    default: false
