name: meteor-guard
version: 1.2
main: com.meteorsmp.antiesp.AntiESPPlugin
api-version: '1.21'
softdepend: [GrimAC, floodgate]
description: meteor-guard anti-ESP, container hiding, join protection, item checks and staff alerts
commands:
  antifreecam:
    description: Shield admin command
    usage: /<command> <reload|toggle|status|bypass|alerts|attack|scan>
    aliases: [antiesp, shield]
permissions:
  antifreecam.admin:
    default: op
  antifreecam.bypass:
    default: false
  antiesp.bypass:
    default: false
  meteorshield.alerts:
    default: op
  meteorshield.bypass:
    default: false
