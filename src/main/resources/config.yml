# MeteorSMP AntiESP configuration
debug: false                # true = log every hide/show to console

enabled-worlds: []          # empty = all worlds, or e.g. [world, world_nether]
check-interval: 2           # ticks between full passes
max-pairs-per-tick: 300     # lag limiter - lower it if you see TPS drops
max-distance: 128.0         # farther than this = never hidden (keep >= your player tracking range)
min-distance: 6.0           # closer than this = always visible (stops pop-in)
thorough-check: false       # true = more rays (corners), fewer pop-ins, more CPU
ignore-spectators: true

# Players on the same scoreboard team never hide from each other
team-exemption:
  enabled: true

occlusion:
  always-occlude: []        # extra materials that block sight, e.g. [GLASS]
  never-occlude:            # materials that never block sight
    - GLASS
    - GLASS_PANE
    - IRON_BARS
    - CHAIN
    - LADDER
    - VINE
    - TORCH
    - WALL_TORCH
    - REDSTONE_TORCH
    - REDSTONE_WALL_TORCH
    - TRIPWIRE
    - TRIPWIRE_HOOK
    - COBWEB
    - SCAFFOLDING
    - BARRIER
    - STRUCTURE_VOID
    - LIGHT

messages:
  plugin-enabled: "&aMeteorAntiESP has been enabled!"
  no-permission: "&cYou do not have permission to use this command!"
  config-reloaded: "&aConfiguration reloaded successfully!"
  bypass-enabled: "&aAntiFreecam & AntiESP bypass has been &2ENABLED&a."
  bypass-disabled: "&cAntiFreecam & AntiESP bypass has been &4DISABLED&c."
